id: geometry-7-atanasyan-14
title: Геометрия. 7 класс
source: Атанасян, Бутузов, Кадомцев и др. Математика. Геометрия. 7–9 классы. Базовый уровень. 14-е изд., 2023. Главы I–V
frontLang: ru
backLang: ru
chapters:
  - title: Глава 1. Начальные геометрические сведения
    sections:
      - title: §1. Прямая и отрезок
        cards:
          Основные неопределяемые понятия планиметрии: Точка и прямая на плоскости. Их не определяют через более простые фигуры; их свойства задают аксиомами.
          Аксиома прямой через две точки: Две различные точки однозначно задают прямую, проходящую через обе.
          Отрезок: Часть прямой между двумя выбранными точками вместе с этими точками — концами отрезка.
          Пересекающиеся прямые: Две различные прямые с общей точкой. Общая точка у них может быть только одна.
      - title: §2. Луч и угол
        cards:
          Луч: Часть прямой, начинающаяся в выбранной точке и продолжающаяся без конца в одну сторону. Начальная точка входит в луч.
          Противоположные лучи: Два луча с общим началом, которые вместе образуют прямую.
          Угол: Фигура из двух лучей с общим началом. Лучи — стороны угла, их общее начало — вершина.
          Развёрнутый угол: Угол, стороны которого — противоположные лучи. Его мера — 180°.
      - title: §3. Сравнение отрезков и углов
        cards:
          Равные геометрические фигуры: Фигуры, которые можно совместить наложением так, чтобы они полностью совпали.
          Равные отрезки: Отрезки, совпадающие при наложении; их длины равны.
          Середина отрезка: Точка отрезка, которая делит его на две равные части.
          Равные углы: Углы, совпадающие при наложении; их градусные меры равны.
          Биссектриса угла: Луч из вершины, проходящий внутри угла и разделяющий его на два равных угла.
      - title: §4. Измерение отрезков
        cards:
          Расстояние между двумя точками: Длина соединяющего их отрезка.
          Основное свойство длины отрезка: Если C лежит между A и B, то AB = AC + CB. Длины всех отрезков измеряются в одной единице.
      - title: §5. Измерение углов
        cards:
          Градус: Единица измерения угла, равная 1/180 развёрнутого угла.
          Угловая минута и угловая секунда: В одном градусе 60 угловых минут, в одной минуте 60 угловых секунд. 1° = 60′, 1′ = 60″.
          Прямой угол: Угол величиной 90° — половина развёрнутого угла.
          Острый угол: Угол, градусная мера которого больше 0° и меньше 90°.
          Тупой угол: Угол, градусная мера которого больше 90° и меньше 180°.
          Основное свойство градусной меры угла: Если луч OC проходит внутри угла AOB, то ∠AOB = ∠AOC + ∠COB.
      - title: §6. Перпендикулярные прямые
        cards:
          Смежные углы: Два угла с общей стороной, у которых две другие стороны — противоположные лучи.
          Свойство смежных углов: Их градусные меры в сумме дают 180°.
          Вертикальные углы: Два угла, у которых стороны одного являются противоположными лучами к сторонам другого.
          Теорема о вертикальных углах: При пересечении двух прямых противоположные, то есть вертикальные, углы имеют одинаковую величину.
          Перпендикулярные прямые: Прямые, пересечение которых образует прямой угол. Все четыре угла при этом равны 90°.
          Угол между пересекающимися прямыми: Меньший из образованных ими углов; при перпендикулярных прямых он равен 90°.
          Единственность перпендикулярной прямой через точку: На плоскости через заданную точку проходит ровно одна прямая, перпендикулярная данной прямой.

  - title: Глава 2. Треугольники
    sections:
      - title: §1. Первый признак равенства треугольников
        cards:
          Треугольник: Фигура из трёх точек, не лежащих на одной прямой, и трёх соединяющих их отрезков. Точки — вершины, отрезки — стороны.
          Периметр треугольника: Сумма длин его сторон. Для сторон a, b, c периметр P = a + b + c.
          Равные треугольники: Треугольники, которые совпадают при наложении. Соответствующие стороны и углы у них попарно равны.
          Теорема: Математическое утверждение, истинность которого устанавливается доказательством.
          Первый признак равенства треугольников: Для равенства двух треугольников достаточно равенства двух соответствующих сторон и угла между ними.
      - title: §2. Медианы, биссектрисы и высоты треугольника
        cards:
          Перпендикуляр из точки к прямой: Отрезок от точки вне прямой до точки на прямой, лежащий на перпендикулярной ей прямой. Конец на прямой — основание перпендикуляра.
          Теорема о перпендикуляре из точки к прямой: Для точки вне прямой существует единственный перпендикулярный отрезок, соединяющий её с этой прямой.
          Медиана треугольника: Отрезок от вершины до середины противоположной стороны.
          Биссектриса треугольника: Отрезок биссектрисы его угла от вершины до противоположной стороны.
          Высота треугольника: Перпендикулярный отрезок от вершины до прямой, содержащей противоположную сторону. Основание может лежать и на продолжении стороны.
          Равнобедренный треугольник: Треугольник с двумя равными сторонами. Эти стороны — боковые, третья сторона — основание.
          Равносторонний треугольник: Треугольник, у которого все три стороны имеют одинаковую длину.
          Теорема об углах равнобедренного треугольника: Два угла, прилежащих к основанию равнобедренного треугольника, одинаковы.
          Теорема о биссектрисе равнобедренного треугольника: Биссектриса из вершины между равными сторонами делит основание пополам и перпендикулярна ему; значит, она также медиана и высота.
          Медиана и высота к основанию равнобедренного треугольника: Медиана, высота и биссектриса, проведённые к основанию из противоположной вершины, совпадают.
      - title: §3. Второй и третий признаки равенства треугольников
        cards:
          Второй признак равенства треугольников: Достаточно равенства одной соответствующей стороны и двух прилежащих к ней углов.
          Третий признак равенства треугольников: Достаточно попарного равенства трёх соответствующих сторон.
      - title: §4. Задачи на построение
        cards:
          Окружность: Все точки плоскости, удалённые от выбранного центра O на одно и то же положительное расстояние R.
          Радиус окружности: Отрезок от центра до точки окружности; также его длина. Все радиусы одной окружности равны.
          Хорда окружности: Отрезок, оба конца которого лежат на окружности.
          Диаметр окружности: Хорда, проходящая через центр окружности. Её длина D = 2R.
          Дуга окружности: Одна из двух частей окружности, на которые её делят две различные точки, вместе с этими концами.
          Серединный перпендикуляр к отрезку: Прямая через середину отрезка, образующая с ним прямой угол.
          Построение циркулем и линейкой: Точное построение с помощью окружностей и прямых. Циркуль переносит расстояния, а линейка без делений проводит прямые, но не измеряет длины.

  - title: Глава 3. Параллельные прямые
    sections:
      - title: §1. Признаки параллельности двух прямых
        cards:
          Параллельные прямые: Различные прямые в одной плоскости, не имеющие общих точек. Обозначение — a ∥ b.
          Секущая двух прямых: Прямая, пересекающая обе данные прямые в двух различных точках.
          Накрест лежащие углы: При двух прямых и секущей — внутренние углы при разных точках пересечения, расположенные по разные стороны секущей.
          Односторонние углы: При двух прямых и секущей — внутренние углы при разных точках пересечения, расположенные по одну сторону секущей.
          Соответственные углы: При двух прямых и секущей — углы при разных точках пересечения, занимающие одинаковое положение. Они лежат по одну сторону секущей; один внутренний, другой внешний.
          Признак параллельности по накрест лежащим углам: Равенство одной пары накрест лежащих углов при секущей достаточно, чтобы две прямые были параллельны.
          Признак параллельности по соответственным углам: Равенство одной пары соответственных углов при секущей достаточно, чтобы две прямые были параллельны.
          Признак параллельности по односторонним углам: Если одна пара односторонних углов при секущей в сумме даёт 180°, то пересечённые ею прямые параллельны.
          Прямые, перпендикулярные одной прямой: Две различные прямые одной плоскости, перпендикулярные одной и той же прямой, параллельны между собой.
      - title: §2. Аксиома параллельных прямых
        cards:
          Аксиома: Исходное математическое положение, которое принимают без доказательства и используют для вывода других утверждений.
          Аксиома откладывания отрезка: Для заданного луча и длины a > 0 есть ровно одна точка луча на расстоянии a от его начала.
          Аксиома откладывания угла: Заданный луч и выбранная сторона от содержащей его прямой однозначно определяют угол заданной величины между 0° и 180°.
          Аксиома параллельных прямых: Если точка M не принадлежит прямой a, то существует ровно одна проходящая через M прямая, параллельная a.
          Следствие: Утверждение, которое непосредственно получается из уже установленной теоремы или аксиомы.
          Секущая одной из двух параллельных прямых: Прямая, пересекающая одну из двух параллельных прямых, обязательно пересекает и вторую.
          Параллельность двух прямых третьей: Если две различные прямые параллельны одной и той же третьей прямой, то они параллельны друг другу.
          Свойство накрест лежащих углов при параллельных прямых: Когда секущая пересекает параллельные прямые, каждая пара накрест лежащих углов имеет одинаковую величину.
          Свойство соответственных углов при параллельных прямых: Когда секущая пересекает параллельные прямые, каждая пара соответственных углов имеет одинаковую величину.
          Свойство односторонних углов при параллельных прямых: Когда секущая пересекает параллельные прямые, каждая пара односторонних углов в сумме даёт 180°.
          Перпендикуляр к одной из параллельных прямых: В одной плоскости прямая, перпендикулярная одной из двух параллельных прямых, перпендикулярна и второй.
          Обратная теорема: Утверждение, в котором условие и заключение исходной теоремы поменяны местами. Его истинность требует отдельного доказательства.
          Углы с соответственно параллельными сторонами: Для двух таких углов либо α = β, либо α + β = 180°.
          Углы с соответственно перпендикулярными сторонами: Для двух таких углов либо α = β, либо α + β = 180°.

  - title: Глава 4. Соотношения между сторонами и углами треугольника
    sections:
      - title: §1. Сумма углов треугольника
        cards:
          Теорема о сумме углов треугольника: Для внутренних углов любого треугольника α + β + γ = 180°.
          Внешний угол треугольника: Угол, смежный с внутренним углом при той же вершине; образуется стороной и продолжением другой стороны.
          Теорема о внешнем угле треугольника: Внешний угол равен сумме двух внутренних углов при других вершинах и потому больше каждого из них.
          Остроугольный треугольник: Треугольник, все три угла которого меньше 90°.
          Прямоугольный треугольник: Треугольник с одним углом 90°. Два остальных угла острые.
          Тупоугольный треугольник: Треугольник с одним углом больше 90°. Два остальных угла острые.
          Катеты и гипотенуза: В прямоугольном треугольнике стороны при прямом угле — катеты; противоположная этому углу сторона — гипотенуза.
          Углы равностороннего треугольника: Все три угла одинаковы; каждый равен 60°.
      - title: §2. Соотношения между сторонами и углами треугольника
        cards:
          Большая сторона и противолежащий угол: Если одна сторона треугольника длиннее другой, то и противолежащий ей угол больше угла напротив другой стороны.
          Больший угол и противолежащая сторона: Если один угол треугольника больше другого, то и противолежащая ему сторона длиннее стороны напротив другого угла.
          Признак равнобедренного треугольника: Если два угла треугольника одинаковы, то стороны напротив них равны и треугольник равнобедренный.
          Сравнение гипотенузы и катета: Гипотенуза длиннее любого из двух катетов того же прямоугольного треугольника.
          Неравенство треугольника: Для каждой стороны треугольника выполняется строгое неравенство — её длина меньше суммы длин двух других сторон.
          Условие существования треугольника по трём сторонам: Для положительных a, b, c треугольник существует тогда и только тогда, когда a + b > c, a + c > b и b + c > a. Равенство даёт вырожденную фигуру, а не треугольник.
      - title: §3. Прямоугольные треугольники
        cards:
          Сумма острых углов прямоугольного треугольника: Два острых угла дополняют друг друга до 90°.
          Катет напротив угла 30°: В прямоугольном треугольнике длина этого катета равна половине длины гипотенузы.
          Признак угла 30° по катету: Если катет вдвое короче гипотенузы, то противоположный ему угол прямоугольного треугольника равен 30°.
          Медиана к гипотенузе: Отрезок от вершины прямого угла до середины гипотенузы имеет длину, равную половине гипотенузы.
          Признак прямоугольного треугольника по медиане: Если медиана треугольника вдвое короче стороны, к которой проведена, то угол напротив этой стороны равен 90°.
          Равенство прямоугольных треугольников по двум катетам: Два прямоугольных треугольника равны, если их катеты попарно имеют одинаковые длины.
          Равенство прямоугольных треугольников по катету и острому углу: Достаточно равенства катетов и соответствующих острых углов. Угол в обоих треугольниках должен быть либо прилежащим к выбранному катету, либо противолежащим ему.
          Равенство прямоугольных треугольников по гипотенузе и острому углу: Достаточно одинаковой длины гипотенуз и равенства одной пары острых углов.
          Равенство прямоугольных треугольников по гипотенузе и катету: Достаточно одинаковой длины гипотенуз и равенства одной пары катетов.
      - title: §4. Построение треугольника по трём элементам
        cards:
          Наклонная из точки к прямой: Отрезок от точки вне прямой до точки на прямой, который не перпендикулярен этой прямой.
          Проекция наклонной на прямую: Отрезок на прямой между основанием перпендикуляра и концом наклонной, проведённых из одной точки.
          Расстояние от точки до прямой: Длина перпендикуляра от точки до прямой; для точки на самой прямой расстояние равно нулю.
          Сравнение перпендикуляра и наклонной: Из одной точки вне прямой перпендикуляр к этой прямой короче любой наклонной к ней.
          Равноудалённость параллельных прямых: Все точки одной из двух параллельных прямых находятся на одинаковом расстоянии от другой.
          Расстояние между параллельными прямыми: Длина перпендикулярного отрезка с концами на этих прямых.

  - title: Глава 5. Геометрические места точек. Симметричные фигуры
    sections:
      - title: §1. Геометрические места точек
        cards:
          Геометрическое место точек: Множество всех точек, удовлетворяющих заданному условию, и только этих точек.
          Свойство точки на биссектрисе угла: Любая точка биссектрисы неразвёрнутого угла имеет одинаковые расстояния до прямых, содержащих его стороны.
          Признак точки на биссектрисе угла: Точка внутри неразвёрнутого угла лежит на его биссектрисе, если её расстояния до прямых, содержащих стороны, равны.
          Пересечение биссектрис треугольника: Все три биссектрисы пересекаются в одной внутренней точке, равноудалённой от сторон треугольника.
          Свойство серединного перпендикуляра: Любая точка серединного перпендикуляра к AB находится на одинаковом расстоянии от A и B.
          Признак точки на серединном перпендикуляре: Если расстояния от точки M до разных точек A и B равны, то M принадлежит серединному перпендикуляру к AB.
          Геометрическое место точек, равноудалённых от двух точек: Для двух различных точек A и B это серединный перпендикуляр к отрезку AB.
          Пересечение серединных перпендикуляров треугольника: Серединные перпендикуляры ко всем трём сторонам пересекаются в одной точке, равноудалённой от вершин.
      - title: §2. Окружность. Касательная к окружности
        cards:
          Внутренняя и внешняя точки окружности: Для окружности с центром O и радиусом R точка M внутри при OM < R, на окружности при OM = R, снаружи при OM > R.
          Диаметр через середину хорды: Если хорда не является диаметром, то прямая через центр окружности и середину хорды перпендикулярна хорде.
          Диаметр, перпендикулярный хорде: При пересечении с хордой такой диаметр делит её на два равных отрезка.
          Угол, под которым виден диаметр: Если AB — диаметр, а C — любая другая точка окружности, то ∠ACB = 90°.
          Геометрическое место точек, из которых отрезок виден под прямым углом: Для отрезка AB это окружность с диаметром AB без точек A и B.
          Секущая окружности: Прямая с двумя точками пересечения с окружностью.
          Касательная к окружности: Прямая, имеющая с окружностью ровно одну общую точку — точку касания.
          Число общих точек прямой и окружности: Возможны ровно три случая — две общие точки, одна или ни одной. Больше двух быть не может.
          Теорема о радиусе в точку касания: Радиус к точке касания образует с касательной прямой угол.
          Признак касательной к окружности: Прямая через точку окружности, перпендикулярная радиусу к этой точке, касается окружности именно в ней.
          Равенство отрезков касательных: Для двух касательных из внешней точки P к одной окружности отрезки от P до точек касания A и B имеют одинаковую длину — PA = PB.
          Углы отрезков касательных с направлением на центр: Если PA и PB — касательные из внешней точки P, а O — центр окружности, то луч PO делит ∠APB пополам.
          Окружность, вписанная в треугольник: Окружность внутри треугольника, касающаяся каждой из трёх его сторон.
          Теорема о вписанной окружности треугольника: У любого треугольника есть ровно одна вписанная окружность.
          Центр вписанной окружности треугольника: Общая точка трёх биссектрис. Радиус равен расстоянию от неё до любой стороны.
          Окружность, описанная около треугольника: Окружность, на которой лежат все три вершины треугольника.
          Теорема об описанной окружности треугольника: Через три вершины любого треугольника проходит ровно одна окружность.
          Центр описанной окружности треугольника: Общая точка серединных перпендикуляров к сторонам. Радиус равен расстоянию от неё до любой вершины.
      - title: §3. Симметричные фигуры
        cards:
          Точки, симметричные относительно прямой: Различные A и A′ симметричны относительно прямой l, когда l — серединный перпендикуляр к AA′. Точка на l симметрична самой себе.
          Фигуры, симметричные относительно прямой: Каждой точке одной фигуры соответствует отражённая относительно этой прямой точка другой фигуры, и наоборот.
          Осевая симметрия: Соответствие, при котором каждая точка плоскости заменяется симметричной ей точкой относительно выбранной прямой — оси.
          Ось симметрии фигуры: Прямая, при отражении относительно которой фигура совпадает сама с собой.
          Неподвижные точки осевой симметрии: При отражении остаются на месте все точки оси и только они.
          Сохранение расстояний при осевой симметрии: Если A′ и B′ — отражения A и B относительно одной оси, то A′B′ = AB.
          Две различные прямые, симметричные относительно оси: Они либо параллельны друг другу, либо пересекаются в точке на оси симметрии.
