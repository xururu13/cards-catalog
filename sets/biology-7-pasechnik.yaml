# Набор карточек для приложения «Карточки». Формат описан в docs/catalog-format.md.
# Чтобы загрузить: «Новая стопка» → «Наборы карточек» → «Загрузить из файла».

id: biology-7-pasechnik
title: Биология. 7 класс
source: По учебнику под ред. В. В. Пасечника, базовый уровень
frontLang: ru
backLang: ru
chapters:
  - title: Глава 1. Многообразие растительного мира
    sections:
      - number: 1
        title: Многообразие организмов, их классификация
        cards:
          Систематика: Наука о многообразии организмов и их распределении по группам на основе сходства и родства.
          Классификация организмов: Распределение организмов по группам (систематическим категориям) по сходству строения и родству.
          Вид: Группа особей, сходных по строению и жизнедеятельности, которые свободно скрещиваются и дают плодовитое потомство.
          Род: Группа близких, родственных видов.
          Систематические категории растений (от мелкой к крупной): Вид → род → семейство → порядок → класс → отдел → царство.
          Двойное (бинарное) название вида: "Название из двух слов: первое — род, второе — вид. Например, клевер ползучий, сосна обыкновенная."
          Карл Линней: Шведский учёный XVIII века. Создал систему классификации растений и животных и ввёл двойные названия видов.
          Царства живой природы: Бактерии, Грибы, Растения, Животные.
      - number: 2
        title: Систематика растений
        cards:
          Ботаника: Наука о растениях.
          Отдел (в систематике растений): Самая крупная систематическая категория внутри царства Растения.
          Низшие растения: Растения, тело которых не разделено на органы и ткани. Это водоросли.
          Высшие растения: Растения, тело которых состоит из органов (корень, стебель, лист) и тканей.
          Слоевище (таллом): Тело низших растений, грибов и лишайников, не разделённое на органы.
          Отделы высших растений: Моховидные, Плауновидные, Хвощевидные, Папоротниковидные, Голосеменные, Покрытосеменные (Цветковые).
          Споровые растения: "Растения, которые размножаются спорами: водоросли, мхи, плауны, хвощи, папоротники."
          Семенные растения: "Растения, которые размножаются семенами: голосеменные и покрытосеменные."
      - number: 3
        title: Общая характеристика водорослей
        cards:
          Водоросли: Низшие растения, живущие в основном в воде. Тело — слоевище, есть хлорофилл, способны к фотосинтезу.
          Хроматофор: "Хлоропласт водорослей. Обычно крупный и необычной формы: чашевидный, лентовидный, звёздчатый."
          Ризоиды: Нитевидные выросты, которыми водоросли и мхи прикрепляются к дну или почве и всасывают воду.
          Хламидомонада: Одноклеточная зелёная водоросль с двумя жгутиками, светочувствительным глазком и чашевидным хроматофором.
          Светочувствительный глазок: Красное пятнышко в клетке хламидомонады. Помогает ей плыть к свету.
          Сократительная вакуоль: Пузырёк в клетке, который удаляет из неё лишнюю воду.
          Зооспоры: Подвижные споры со жгутиками. Служат водорослям для бесполого размножения.
          Гаметы: Половые клетки.
          Зигота: Клетка, которая образуется при слиянии двух гамет.
          Как размножаются водоросли: Бесполо — делением клетки, частями слоевища, зооспорами; половым путём — слиянием гамет.
      - number: 4
        title: Многообразие водорослей
        cards:
          Отделы водорослей (в учебнике): Зелёные, Бурые, Красные (багрянки). Также упоминают диатомовые.
          Хлорелла: Одноклеточная зелёная водоросль без жгутиков. Быстро размножается, её используют как корм и для получения кислорода.
          Спирогира: Нитчатая зелёная водоросль пресных водоёмов с хроматофором в виде спиральной ленты. Образует тину.
          Улотрикс: Нитчатая зелёная водоросль, прикрепляется к камням и корягам в реках.
          Бурые водоросли: Многоклеточные морские водоросли. Кроме хлорофилла содержат бурые пигменты. Пример — ламинария.
          Ламинария: Бурая водоросль, «морская капуста». Её едят, из неё получают йод.
          Красные водоросли (багрянки): Морские водоросли с красными пигментами. Могут жить на большой глубине, куда доходит мало света. Пример — порфира.
          Агар-агар: Студенистое вещество из красных водорослей. Используют в кондитерском деле (мармелад, пастила) и в лабораториях.
          Диатомовые водоросли: Одноклеточные водоросли с кремнезёмным панцирем из двух половинок.
          Значение водорослей в природе: Выделяют кислород, создают органические вещества, служат пищей и укрытием для водных животных.
      - number: 5
        title: Высшие споровые растения
        cards:
          Высшие споровые растения: Мхи, плауны, хвощи и папоротники. Есть органы и ткани, размножаются спорами.
          Спора: Клетка для бесполого размножения и расселения растений и грибов.
          Спорангий: Орган, в котором образуются споры.
          Гаметофит: Половое поколение растения, на нём образуются гаметы.
          Спорофит: Бесполое поколение растения, на нём образуются споры.
          Чередование поколений: Смена в жизненном цикле растения полового поколения (гаметофита) и бесполого (спорофита).
          Антеридий: Мужской половой орган споровых растений, в нём образуются сперматозоиды.
          Архегоний: Женский половой орган споровых растений, в нём образуется яйцеклетка.
          Почему для оплодотворения мхам и папоротникам нужна вода: Сперматозоиды добираются до яйцеклетки только вплавь — в капле воды.
      - number: 6
        title: Отдел Моховидные
        cards:
          Мхи: Высшие споровые растения без корней. Есть стебель и листья, к почве крепятся ризоидами.
          Кукушкин лён: Зелёный мох с прямым стеблем и жёсткими листьями. Двудомное растение, споры созревают в коробочке на ножке.
          Сфагнум: Белый, или торфяной, мох болот. Не имеет ризоидов, накапливает много воды, образует торф.
          Водоносные клетки: Мёртвые клетки в листьях сфагнума, которые впитывают и удерживают воду.
          Коробочка (у мхов): Спорангий мха на длинной ножке. Это спорофит, в нём созревают споры.
          Предросток (протонема): Зелёная ветвящаяся нить, которая вырастает из споры мха. На ней развиваются новые растения мха.
          Торф: Остатки болотных мхов и других растений, которые не перегнили из-за избытка воды и недостатка воздуха.
          Двудомные растения: Растения, у которых мужские и женские половые органы находятся на разных особях.
          Какое поколение преобладает у мхов: Половое — гаметофит. Зелёное растение мха — это гаметофит, коробочка на ножке — спорофит.
      - number: 7
        title: Отделы Папоротниковидные, Плауновидные, Хвощевидные
        cards:
          Папоротники: Высшие споровые растения с корнями, корневищем и крупными рассечёнными листьями (вайями).
          Вайи: Листья папоротника. Растут верхушкой, молодые закручены «улиткой».
          Корневище: Подземный побег, похожий на корень. Есть у папоротников, хвощей, ландыша, пырея.
          Сорусы: Группы спорангиев на нижней стороне листьев папоротника, бурые бугорки.
          Заросток: "Половое поколение (гаметофит) папоротника: маленькая зелёная пластинка в форме сердечка."
          Какое поколение преобладает у папоротников: Бесполое — спорофит. Крупное растение папоротника — спорофит, заросток — гаметофит.
          Хвощи: Высшие споровые растения с членистыми стеблями и мутовками мелких листьев. Стебли жёсткие из-за кремнезёма.
          Спороносный колосок: Верхушка побега хвоща или плауна, на которой образуются спорангии.
          Плауны: Вечнозелёные стелющиеся растения с мелкими листьями и спороносными колосками. Пример — плаун булавовидный.
          Каменный уголь: Образовался из остатков древних древовидных плаунов, хвощей и папоротников.
      - number: 8
        title: Отдел Голосеменные растения
        cards:
          Голосеменные: Семенные растения без цветков и плодов. Семена лежат открыто на чешуях шишек.
          Семя: "Орган размножения семенных растений: зародыш, запас питательных веществ и семенная кожура."
          Шишка: Укороченный видоизменённый побег голосеменных с чешуями, на которых образуются пыльца или семязачатки.
          Семязачаток: Образование, из которого после оплодотворения развивается семя.
          Пыльца (пыльцевые зёрна): Мельчайшие зёрна, в которых образуются мужские половые клетки (спермии) семенных растений.
          Спермии: Неподвижные мужские половые клетки семенных растений.
          Почему голосеменным не нужна вода для оплодотворения: Пыльцу переносит ветер, а спермии доставляет к яйцеклетке пыльцевая трубка.
          Хвоя: Игольчатые или чешуевидные листья хвойных растений.
          Примеры хвойных растений: Сосна, ель, пихта, лиственница, кедровая сосна (кедр), можжевельник, тис.
          Лиственница: Хвойное дерево, которое сбрасывает хвою на зиму.
          Сколько созревают семена сосны: Около полутора лет после опыления.
      - number: 9
        title: Отдел Покрытосеменные, или Цветковые, растения
        cards:
          Покрытосеменные (цветковые) растения: Самая многочисленная группа растений. Есть цветок и плод, семена находятся внутри плода.
          Цветок: Укороченный видоизменённый побег, орган семенного размножения покрытосеменных.
          Плод: Орган, который развивается из завязи пестика. Защищает семена и помогает им распространяться.
          Пестик: "Женская часть цветка: рыльце, столбик и завязь с семязачатками."
          Тычинка: "Мужская часть цветка: тычиночная нить и пыльник с пыльцой."
          Опыление: Перенос пыльцы с тычинок на рыльце пестика.
          Двойное оплодотворение: Один спермий сливается с яйцеклеткой (зародыш), второй — с центральной клеткой (эндосперм). Открыл С. Г. Навашин.
          Эндосперм: Ткань семени с запасом питательных веществ для зародыша.
          Жизненные формы растений: Деревья, кустарники, кустарнички, травы.
          Почему покрытосеменные господствуют на Земле: Есть цветок и плод, двойное оплодотворение, хорошо развитые проводящие ткани (сосуды), разнообразные жизненные формы.
      - number: 10
        title: Развитие растительного мира
        cards:
          Эволюция: Историческое развитие живой природы — от простых организмов к сложным.
          Палеонтология: Наука об ископаемых (вымерших) организмах.
          Первые растения на Земле: Одноклеточные водоросли в древнем океане.
          Риниофиты (псилофиты): Первые наземные растения. Не имели корней и листьев, размножались спорами.
          Порядок появления групп растений: Водоросли → риниофиты → мхи, плауны, хвощи, папоротники → голосеменные → покрытосеменные.
          Ископаемые остатки: Окаменелости и отпечатки древних организмов в горных породах.
          Чарлз Дарвин: Английский учёный XIX века, создатель учения об эволюции путём естественного отбора.
          Естественный отбор: Выживание и размножение организмов, лучше приспособленных к условиям среды.
  - title: Глава 2. Классификация покрытосеменных растений
    sections:
      - number: 11
        title: Классификация покрытосеменных
        cards:
          Классы покрытосеменных: Двудольные и Однодольные.
          Семядоля: Зародышевый лист в семени.
          Признаки двудольных: Две семядоли, стержневая корневая система, сетчатое жилкование листьев, цветки обычно из 4–5 частей.
          Признаки однодольных: Одна семядоля, мочковатая корневая система, параллельное или дуговое жилкование, цветки обычно из 3 частей.
          Семейство: Группа близких родственных родов.
          Формула цветка: "Короткая запись строения цветка буквами и цифрами: Ч — чашелистики, Л — лепестки, Т — тычинки, П — пестики, О — простой околоцветник."
          "Знаки в формуле цветка: ( ) и ∞": Скобки — части срослись; ∞ — частей много.
          Околоцветник: Чашечка и венчик цветка. Двойной — есть и чашечка, и венчик; простой — листочки одинаковые.
          Соцветие: Группа цветков, расположенных близко друг к другу в определённом порядке.
      - number: 12
        title: Класс Двудольные. Семейства Крестоцветные и Розоцветные
        cards:
          "Крестоцветные (Капустные): формула цветка": Ч4 Л4 Т4+2 П1. Четыре лепестка расположены крестом.
          "Крестоцветные: плод и соцветие": Плод — стручок или стручочек, соцветие — кисть.
          Примеры крестоцветных: Капуста, редис, редька, репа, горчица, рапс, пастушья сумка.
          Стручок и стручочек: Сухие плоды крестоцветных. Стручок длинный, у стручочка длина и ширина почти равны.
          "Розоцветные: формула цветка": Ч5 Л5 Т∞ П1 или П∞.
          Примеры розоцветных: Яблоня, груша, вишня, слива, шиповник, малина, земляника, рябина.
          Плоды розоцветных: Яблоко, костянка, сборная костянка, многоорешек.
          Костянка: "Сочный плод с одной косточкой внутри: вишня, слива, абрикос."
          Сборная костянка: "Плод из многих мелких костянок: малина, ежевика."
          Яблоко (тип плода): Сочный многосеменной плод яблони, груши, рябины.
      - number: 13
        title: Класс Двудольные. Семейства Паслёновые, Мотыльковые и Сложноцветные
        cards:
          "Паслёновые: формула цветка": Ч(5) Л(5) Т5 П1 — чашечка и венчик сросшиеся.
          "Паслёновые: плод и примеры": Плод — ягода или коробочка. Картофель, томат, перец, баклажан, табак, петуния.
          Ядовитые паслёновые: Белена, дурман, красавка (белладонна). Ядовиты также зелёные клубни и ягоды картофеля.
          "Мотыльковые (Бобовые): строение венчика": Парус, два весла и лодочка из двух сросшихся лепестков.
          "Мотыльковые: плод и примеры": Плод — боб. Горох, фасоль, соя, чечевица, клевер, люпин, акация.
          Боб: Сухой плод, раскрывается двумя створками, семена прикреплены к обеим створкам.
          Клубеньки: Вздутия на корнях бобовых. В них живут бактерии, которые усваивают азот воздуха и обогащают почву.
          "Сложноцветные (Астровые): соцветие и плод": Соцветие — корзинка, плод — семянка.
          Типы цветков сложноцветных: Трубчатые, язычковые, ложноязычковые, воронковидные.
          Примеры сложноцветных: Подсолнечник, ромашка, одуванчик, василёк, астра, георгин, полынь.
          Семянка: "Сухой односеменной нераскрывающийся плод: у подсолнечника, одуванчика."
      - number: 14
        title: Класс Однодольные. Семейства Лилейные и Злаки
        cards:
          "Лилейные: формула цветка": О3+3 Т3+3 П1 — простой околоцветник из шести листочков.
          "Лилейные: плод и примеры": Плод — коробочка или ягода. Тюльпан, лилия, рябчик, лук, чеснок, ландыш.
          Луковица: Подземный побег с плоским стеблем (донцем) и сочными чешуями-листьями.
          "Злаки (Мятликовые): строение цветка": "Цветки мелкие: две цветковые чешуи, две плёнки, три тычинки, пестик с перистыми рыльцами."
          Соцветия злаков: Сложный колос (пшеница, рожь, ячмень), метёлка (овёс, рис, просо), початок (кукуруза).
          Соломина: Полый стебель злаков с утолщениями — узлами.
          Зерновка: "Плод злаков: околоплодник срастается с семенной кожурой."
          Примеры злаков: Пшеница, рожь, ячмень, овёс, рис, кукуруза, просо, бамбук, тимофеевка, пырей.
      - number: 15
        title: Многообразие и происхождение культурных растений
        cards:
          Культурные растения: Растения, которые человек вывел из диких предков и выращивает.
          Сорт: Группа растений, созданная человеком, с наследственными признаками, полезными для него.
          Селекция: Наука о выведении новых сортов растений и пород животных.
          Искусственный отбор: Отбор человеком растений с нужными признаками для дальнейшего размножения.
          Н. И. Вавилов: Русский учёный. Установил центры происхождения культурных растений, собрал огромную коллекцию семян.
          Центры происхождения культурных растений: Районы Земли, где культурные растения были впервые выведены из диких предков.
          Зерновые культуры: Пшеница, рожь, рис, кукуруза, ячмень, овёс, гречиха.
          Масличные культуры: Подсолнечник, маслина (олива), лён, рапс, соя.
          Прядильные культуры: "Растения для получения волокна: хлопчатник, лён, конопля."
          Родина картофеля, томата и кукурузы: Америка (картофель и томат — Южная, кукуруза — Центральная).
  - title: Глава 3. Растения и среда обитания
    sections:
      - number: 16
        title: Среда обитания растений. Экологические факторы
        cards:
          Экология: Наука о связях организмов между собой и со средой обитания.
          Среда обитания: Часть природы, которая окружает организм и с которой он взаимодействует.
          Экологические факторы: Условия среды, которые действуют на организм.
          Абиотические факторы: "Факторы неживой природы: свет, температура, влажность, состав почвы и воздуха."
          Биотические факторы: "Влияние живых организмов друг на друга: опыление, поедание, паразитизм, конкуренция."
          Антропогенные факторы: "Влияние деятельности человека: вырубка лесов, распашка земель, загрязнение."
          Светолюбивые и теневыносливые растения: Светолюбивые растут на открытых местах (берёза, сосна, рожь); теневыносливые — в тени (кислица, ель, папоротники).
          Приспособления растений к засухе: Длинные корни, мелкие или колючие листья, восковой налёт, запас воды в стеблях (кактус, верблюжья колючка).
      - number: 17
        title: Растительные сообщества
        cards:
          Растительное сообщество (фитоценоз): Растения, которые совместно живут на одной территории и связаны друг с другом.
          Природное сообщество (биогеоценоз): Растения, животные, грибы и бактерии одной территории вместе с неживой средой.
          Производители (продуценты): Организмы, создающие органические вещества из неорганических. Это растения.
          Потребители (консументы): Организмы, питающиеся готовыми органическими веществами. Это животные.
          Разрушители (редуценты): Бактерии и грибы, разлагающие мёртвые остатки до неорганических веществ.
          Цепь питания: "Ряд организмов, где каждый служит пищей следующему. Например: трава → заяц → лиса."
          Круговорот веществ: Многократный переход веществ от неживой природы к организмам и обратно.
          Агроценоз: "Искусственное сообщество, созданное человеком: поле, сад, огород."
          Смена растительных сообществ: Постепенная замена одного сообщества другим, например заросшее озеро → болото → луг.
      - number: 18
        title: Структура растительного сообщества
        cards:
          Ярусность: Расположение растений сообщества слоями (ярусами) по высоте.
          Ярусы леса: Деревья → подлесок (кустарники) → травы и кустарнички → мхи и лишайники.
          Подлесок: "Кустарники и невысокие деревья под пологом леса: орешник, крушина, рябина."
          Подрост: Молодые деревья основных пород леса, которые со временем сменят взрослые.
          Подземная ярусность: Корни разных растений сообщества находятся на разной глубине почвы.
          Видовое разнообразие сообщества: Число видов, которые входят в сообщество.
          Преобладающие виды (доминанты): Виды, которых в сообществе больше всего, например сосна в сосновом бору.
      - number: 19
        title: Охрана растительного мира
        cards:
          Красная книга: Список редких и исчезающих видов растений и животных, которые нуждаются в охране.
          Заповедник: Территория, где запрещена любая хозяйственная деятельность ради сохранения природы.
          Заказник: Территория, где ограничены отдельные виды деятельности, чтобы сохранить определённые виды или участки природы.
          Национальный парк: Охраняемая территория, где природу сохраняют и где можно отдыхать и путешествовать по правилам.
          Памятник природы: "Охраняемый отдельный природный объект: старое дерево, водопад, скала, роща."
          Ботанический сад: Учреждение, где собирают, изучают и сохраняют растения со всего мира.
          Примеры растений из Красной книги России: Венерин башмачок настоящий, лотос орехоносный, женьшень настоящий.
  - title: Глава 4. Бактерии
    sections:
      - number: 20
        title: Строение и жизнедеятельность бактерий
        cards:
          Бактерии: Мельчайшие одноклеточные организмы без оформленного ядра.
          Прокариоты: Организмы, в клетках которых нет оформленного ядра. Это бактерии.
          Эукариоты: "Организмы, клетки которых имеют ядро: растения, грибы, животные."
          Формы бактерий: Кокки (шарики), бациллы (палочки), вибрионы (запятые), спириллы (спирали).
          Как размножаются бактерии: Делением клетки надвое. В хороших условиях — каждые 20–30 минут.
          Спора бактерии: "Клетка с плотной оболочкой, которая переживает неблагоприятные условия: холод, жару, засуху."
          Автотрофы: Организмы, которые сами создают органические вещества из неорганических.
          Гетеротрофы: Организмы, которые питаются готовыми органическими веществами.
          Сапротрофы: Организмы, которые питаются органическими веществами мёртвых остатков.
          Паразиты: Организмы, которые живут за счёт другого живого организма и вредят ему.
          Симбиоз: Взаимовыгодное сожительство организмов разных видов.
          Цианобактерии: Бактерии, способные к фотосинтезу. Раньше их называли сине-зелёными водорослями.
      - number: 21
        title: Роль бактерий в природе и жизни человека
        cards:
          Гниение: Разложение мёртвых органических остатков бактериями.
          Роль почвенных бактерий: Разлагают остатки организмов и образуют перегной (гумус), повышают плодородие почвы.
          Клубеньковые бактерии: Живут в клубеньках на корнях бобовых и усваивают азот воздуха.
          Молочнокислые бактерии: Превращают сахар в молочную кислоту. Используются для кефира, йогурта, сыра, квашеной капусты, силоса.
          Болезнетворные бактерии: "Вызывают болезни: туберкулёз, ангину, холеру, дизентерию, столбняк, чуму."
          Пастеризация: Нагревание продукта до 60–70 °C, чтобы уничтожить большинство бактерий. Метод Луи Пастера.
          Стерилизация: Полное уничтожение микроорганизмов высокой температурой или другими способами.
          Консервирование: "Обработка продуктов, которая не даёт бактериям развиваться: соление, сушка, замораживание, маринование."
          Силос: Корм для скота из заквашенной зелёной массы растений.
  - title: Глава 5. Грибы
    sections:
      - number: 22
        title: Общая характеристика грибов
        cards:
          Грибы: Особое царство организмов с ядром. Питаются готовыми органическими веществами, тело — грибница, размножаются спорами.
          Микология: Наука о грибах.
          Грибница (мицелий): Тело гриба из тонких ветвящихся нитей — гиф.
          Гифы: Тонкие ветвящиеся нити, из которых состоит грибница.
          Хитин: Прочное вещество клеточной стенки грибов. Есть и в покровах насекомых.
          Запасное вещество грибов: Гликоген — как у животных (а не крахмал, как у растений).
          Чем грибы похожи на растения: Неподвижны, растут всю жизнь, имеют клеточную стенку, всасывают питательные вещества.
          Чем грибы похожи на животных: Питаются готовыми органическими веществами, в клеточной стенке хитин, запасают гликоген.
          Плодовое тело: Часть гриба над землёй, где образуются споры. То, что мы называем грибом.
      - number: 23
        title: Шляпочные грибы
        cards:
          Шляпочные грибы: Грибы, плодовое тело которых состоит из шляпки и ножки.
          Трубчатые грибы: Нижний слой шляпки состоит из трубочек. Белый гриб, подберёзовик, подосиновик, маслёнок.
          Пластинчатые грибы: На нижней стороне шляпки — пластинки. Сыроежка, груздь, рыжик, опёнок, мухомор, бледная поганка.
          Где образуются споры шляпочного гриба: В трубочках или на пластинках нижней стороны шляпки.
          Микориза (грибокорень): Взаимовыгодное сожительство грибницы с корнями растения.
          Что получают друг от друга гриб и дерево при микоризе: Гриб даёт дереву воду и минеральные соли, дерево грибу — органические вещества.
          Самые опасные ядовитые грибы: Бледная поганка (самая ядовитая), мухоморы, ложные опята, сатанинский гриб.
          Грибы, которые выращивает человек: Шампиньоны, вешенки.
      - number: 24
        title: Плесневые грибы и дрожжи
        cards:
          Мукор (белая плесень): "Плесневый гриб: грибница из одной разветвлённой клетки, споры в чёрных головках. Растёт на хлебе и овощах."
          Пеницилл (зелёная плесень): Плесневый гриб с многоклеточной грибницей, споры на кисточках. Из него получают пенициллин.
          Антибиотики: Вещества, которые убивают бактерии или останавливают их рост.
          Пенициллин: Первый антибиотик. Открыт Александром Флемингом в 1928 году в плесени пеницилла.
          Дрожжи: Одноклеточные грибы, размножаются почкованием, вызывают брожение.
          Почкование: Размножение, при котором на материнской клетке образуется выпячивание (почка) и отделяется.
          Брожение (спиртовое): Расщепление сахара без кислорода с образованием спирта и углекислого газа.
          Почему тесто на дрожжах поднимается: Дрожжи выделяют углекислый газ, его пузырьки делают тесто пышным.
      - number: 25
        title: Грибы — паразиты растений, животных, человека
        cards:
          Трутовики: Грибы-паразиты деревьев с твёрдыми плодовыми телами. Вызывают гниль древесины.
          Головня: "Гриб-паразит злаков: колос превращается в чёрную массу спор."
          Спорынья: "Гриб-паразит ржи: на колосе вырастают тёмные рожки, ядовитые для человека и животных."
          Фитофтора: "Возбудитель болезни картофеля и томатов: бурые пятна на листьях и гниль клубней и плодов."
          Мучнистая роса: "Болезнь растений, вызванная грибом: белый мучнистый налёт на листьях."
          Грибковые болезни человека: Стригущий лишай, грибок кожи и ногтей, молочница.
          Как защищают растения от грибов-паразитов: Протравливают семена, убирают поражённые растения, выводят устойчивые сорта, обрабатывают растения.
      - number: 26
        title: Лишайники
        cards:
          Лишайники: Организмы, тело которых образовано грибом и водорослью (или цианобактерией), живущими вместе.
          Роль гриба и водоросли в лишайнике: Гриб даёт воду и минеральные соли, водоросль создаёт органические вещества фотосинтезом.
          Формы лишайников: Накипные (корковые), листоватые, кустистые.
          Накипные лишайники: Плотно срастаются с корой или камнем в виде корочки.
          Листоватые лишайники: Похожи на пластинки, прикрепляются к опоре в нескольких местах. Пример — ксантория (золотистая стенная).
          Кустистые лишайники: Похожи на маленькие кустики или свисающие бороды. Пример — ягель, бородач.
          Ягель (олений мох): Кустистый лишайник тундры, главный зимний корм северных оленей.
          Лишайники — индикаторы чистоты воздуха: "Не растут там, где воздух загрязнён: очень чувствительны к дыму и выхлопным газам."
          Лишайники — «пионеры» растительности: Первыми заселяют голые скалы, разрушают горные породы и образуют первичную почву.
          Как размножаются лишайники: Обычно частями слоевища, а также спорами гриба.
